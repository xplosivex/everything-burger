<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Reset Password - Everything Burger</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Everything Burger">
    <meta property="og:title" content="Everything Burger - Reset Password">
    <meta property="og:description" content="Everything Burger: a gamified AI page generator that never makes the same page twice.">
    <meta property="og:url" content="{{ request.url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Everything Burger - Reset Password">
    <meta name="twitter:description" content="Everything Burger: a gamified AI page generator that never makes the same page twice.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        .retro-title {
            font-family: 'Press Start 2P', cursive;
        }
        .retro-text {
            font-family: 'VT323', monospace;
            font-size: 1.2em;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .retro-heading {
            font-family: 'Silkscreen', monospace;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-12">
            <h1 class="retro-title text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-green-500">
                EVERYTHING<br class="md:hidden"> BURGER 2
                <span class="retro-heading text-xl md:text-2xl font-bold text-gray-600 block">RESET PASSWORD</span>
            </h1>
        </div>

        <div class="max-w-3xl mx-auto">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-4 rounded {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="bg-white backdrop-blur-lg bg-opacity-90 shadow-2xl rounded-2xl px-8 pt-8 pb-8 mb-4 border border-gray-200">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-6">
                    <label class="retro-text block text-gray-800 text-lg font-bold mb-4" for="password">
                        New Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="retro-text shadow-inner appearance-none border-2 border-gray-200 rounded-xl w-full py-3 px-4 text-gray-700 leading-relaxed focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all duration-200"
                        required
                    >
                </div>
                <div class="flex items-center justify-between">
                    <button
                        class="retro-text bg-gradient-to-r from-blue-500 to-blue-700 text-white text-lg font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
                        type="submit"
                    >
                        <span class="flex items-center justify-center">
                            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                            Reset Password
                        </span>
                    </button>
                    <div class="flex flex-col items-end space-y-2">
                        <a
                            href="/login"
                            class="retro-text w-full sm:w-auto text-center font-bold text-lg text-blue-500 hover:text-blue-800 transition-colors duration-200"
                        >
                            Back to Login
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
