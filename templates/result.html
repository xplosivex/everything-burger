<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Generated Result - Everything Burger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="save-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-4 sm:p-8 rounded-lg max-w-lg w-11/12">
            <h2 class="text-lg sm:text-xl font-semibold mb-4">Save Page</h2>
            <form id="save-form" action="/save_page" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <input type="hidden" name="html_content" id="html-content-input" value="{{ html_content }}">
                <input id="prompt-input" type="hidden" name="prompt" value="{{ prompt | safe}}">
                <div class="mb-4">
                    <input type="text" name="title" placeholder="Page Title" maxlength="35" required class="w-full text-sm p-2 border border-gray-300 rounded">
                </div>
                <div class="mb-4">
                    <input type="text" name="description" placeholder="Description" maxlength="100" class="w-full text-sm p-2 border border-gray-300 rounded">
                </div>
                <div class="mb-4">
                    <input type="text" name="tags" placeholder="Tags (max 6, comma-separated)" maxlength="100" onkeyup="validateTags(this)" class="w-full text-sm p-2 border border-gray-300 rounded">
                    <script>
                        function validateTags(input) {
                            let tags = input.value.split(',').filter(tag => tag.trim() !== '');
                            if (tags.length > 6) {
                                input.value = tags.slice(0, 6).join(',');
                            }
                        }
                    </script>
                </div>
                <div class="mb-6">
                    <select name="visibility" class="w-full text-sm p-2 border border-gray-300 rounded">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                        <option value="unlisted">Unlisted</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" id="cancel-save" class="text-sm px-4 py-2 rounded bg-gray-200 hover:bg-gray-300">Cancel</button>
                    <button type="submit" id="modal-save-button" class="text-sm px-4 py-2 rounded bg-green-600/80 hover:bg-green-700/80 text-white">Save Page</button>
                </div>
            </form>
        </div>
    </div>
    <div class="fixed top-0 left-0 right-0 bg-white z-40 min-h-[8rem] sm:h-32">
        <div class="container mx-auto px-4">
            <div class="flex flex-col sm:flex-row justify-between items-center py-4 sm:py-6 gap-4">
                <h1 class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-green-500 text-center sm:text-left">
                    EVERYTHING BURGER 2
                    <span class="text-xl sm:text-2xl font-bold text-gray-600 block">GENERATED RESULT</span>
                </h1>
                <div class="flex flex-wrap sm:flex-nowrap justify-center gap-2 sm:gap-4 w-full sm:w-auto">
                    <a href="/" class="w-full sm:w-auto transform hover:scale-105 transition-transform duration-200 bg-gradient-to-r from-green-500 to-green-600 text-white font-bold py-2 sm:py-3 px-4 sm:px-6 rounded-lg shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
                        <span class="flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            Dashboard
                        </span>
                    </a>
                    <form action="/regenerate/{{ task_id }}" method="POST" class="w-full sm:w-auto">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <button type="submit" disabled class="w-full opacity-50 cursor-not-allowed transform hover:scale-105 transition-transform duration-200 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold py-2 sm:py-3 px-4 sm:px-6 rounded-lg shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                            <span class="flex items-center justify-center">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                Regenerate
                            </span>
                        </button>
                    </form>
                    <button id="save-button" disabled class="w-full sm:w-auto opacity-50 cursor-not-allowed transform hover:scale-105 transition-transform duration-200 bg-gradient-to-r from-gray-600 to-gray-700 text-white font-bold py-2 sm:py-3 px-4 sm:px-6 rounded-lg shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
                        <span class="flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                            Save Page
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="fixed top-32 left-0 right-0 bottom-0 overflow-hidden flex justify-center items-center">
        <iframe id="content-frame" class="w-full h-full border-0" style="background: transparent;" srcdoc=""></iframe>
    </div>
    <div id="loading-container" class="fixed inset-0 top-32 flex items-center justify-center" style="display: none;">
        <div class="text-center w-72">
            <img class="h-48 w-48 mx-auto" src="/static/page_assets/transparent_burger_animation.gif" alt="Loading burger animation">
            <div id="loading-message" class="mt-6 text-2xl font-bold text-gray-700 animate-pulse"></div>
            <div class="mt-5 w-full bg-gray-200 rounded-full h-2.5">
                <div id="gen-progress-bar" class="bg-indigo-500 h-2.5 rounded-full transition-all duration-500" style="width:0%"></div>
            </div>
            <div id="gen-progress-pct" class="mt-1 text-sm text-gray-500">0%</div>
        </div>
    </div>
    <script>
        const loadingMessages = [
            "Toasting the buns...",
            "Flipping the patties...",
            "Adding secret sauce...",
            "Stacking layers of cheese...",
            "Chopping fresh lettuce...",
            "Slicing tomatoes paper-thin...",
            "Grilling onions to perfection...",
            "Warming up the griddle...",
            "Seasoning with special spices...",
            "Preparing the pickle slices...",
            "Mixing the special sauce...",
            "Cleaning the grill marks...",
            "Checking burger temperature...",
            "Adding extra cheese (because why not)...",
            "Consulting the burger oracle...",
            "Summoning the burger spirits...",
            "Calculating optimal stack height...",
            "Calibrating condiment ratios...",
            "Performing burger algebra...",
            "Consulting ancient burger recipes...",
            "Channeling Gordon Ramsay...",
            "Studying burger physics...",
            "Applying ketchup algorithms...",
            "Optimizing flavor matrices...",
            "Rendering burger in 3D...",
            "Downloading more RAM sauce...",
            "Reticulating burger splines...",
            "Generating synthetic mayo...",
            "Calculating cheese angles...",
            "Measuring burger velocity...",
            "Activating flavor enhancers...",
            "Initializing taste protocols...",
            "Charging flavor capacitors...",
            "Engaging burger boosters...",
            "Synchronizing condiments...",
            "Calibrating meat thermometer...",
            "Activating pickle matrix...",
            "Loading burger physics engine...",
            "Generating random crunch...",
            "Simulating bite mechanics...",
            "Calculating optimal melt coefficient...",
            "Engaging flavor thrusters...",
            "Activating umami sensors...",
            "Initializing taste receptors...",
            "Charging flavor batteries...",
            "Warming up the grill AI...",
            "Teaching lettuce quantum physics...",
            "Calculating sauce trajectory...",
            "Preparing burger landing zone...",
            "Engaging maximum flavor drive..."
        ];

        const saveModal = document.getElementById('save-modal');
        const cancelSave = document.getElementById('cancel-save');
        const contentFrame = document.getElementById('content-frame');
        const htmlContentInput = document.getElementById('html-content-input');
        const saveForm = document.getElementById('save-form');
        const modalSaveButton = document.getElementById('modal-save-button');
        const saveButton = document.getElementById('save-button');
        let hasBeenSaved = false;

        saveButton.addEventListener('click', () => {
            saveModal.classList.remove('hidden');
        });

        saveForm.addEventListener('submit', () => {
            // Get the content directly from the iframe
            const iframeContent = contentFrame.contentDocument.documentElement.outerHTML;
            htmlContentInput.value = iframeContent;

            hasBeenSaved = true;
            saveButton.classList.add('bg-gray-400', 'cursor-not-allowed');
            saveButton.classList.remove('hover:bg-blue-600');
            modalSaveButton.disabled = true;
            modalSaveButton.classList.add('bg-gray-400', 'cursor-not-allowed');
            modalSaveButton.classList.remove('hover:bg-green-700/80');
            modalSaveButton.textContent = 'Saving...';

            // Update cancel button styling but keep original text
            cancelSave.disabled = true;
            cancelSave.classList.add('bg-gray-400', 'cursor-not-allowed');
            cancelSave.textContent = 'Cancel'; // Ensure cancel text stays as "Cancel"
        });

        cancelSave.addEventListener('click', () => {
            saveModal.classList.add('hidden');
        });

        const regenerateForm = document.querySelector('form');
        const regenerateButton = regenerateForm.querySelector('button');

        regenerateForm.addEventListener('submit', (e) => {
            regenerateButton.textContent = 'Regenerating...';
            regenerateButton.classList.add('bg-gray-400', 'cursor-not-allowed');
            regenerateButton.classList.remove('hover:bg-blue-600');
            regenerateButton.disabled = true;
        });

        const socket = io();
        const taskId = '{{ task_id }}';

        const initialContent = {{ html_content | tojson }};

        const loadingContainer = document.getElementById('loading-container');
        const loadingMessage = document.getElementById('loading-message');

        // Function to cycle through loading messages
        function cycleLoadingMessages() {
            let index = 0;
            loadingMessage.textContent = loadingMessages[0];
            let _prog = 0;
            window._progressTimer = setInterval(function() {
                // Calibrated for ~2-3 min generation:
                // 0-30%  in ~30s  (startup + first API call)
                // 30-75% in ~90s  (2 min total — bulk of generation)
                // 75-87% in ~48s  (finishing up — 2m50s total)
                // holds at 87%   until generation_complete fires
                let increment;
                if (_prog < 30) increment = 0.8;
                else if (_prog < 75) increment = 0.4;
                else if (_prog < 87) increment = 0.2;
                else increment = 0;
                _prog = Math.min(_prog + increment, 87);
                document.getElementById('gen-progress-bar').style.width = _prog.toFixed(1) + '%';
                document.getElementById('gen-progress-pct').textContent = Math.floor(_prog) + '%';
            }, 800);

            setInterval(() => {
                index = (index + 1) % loadingMessages.length;
                loadingMessage.textContent = loadingMessages[index];
            }, 2000);
        }

        function showLoadingState() {
            loadingContainer.style.display = 'flex';
            cycleLoadingMessages();
            contentFrame.srcdoc = `
                <html>
                <head>
                    <style>
                        body { 
                            margin: 0;
                            background: transparent;
                        }
                        .content-wrapper { 
                            padding: 2rem; 
                            padding-top: 4rem;
                        }
                    </style>
                </head>
                <body>
                    <div class="content-wrapper"></div>
                </body>
                </html>
            `;
        }

        function enableButtons() {
            // Fix regenerate button enabling
            const regenerateButton = document.querySelector('form[action^="/regenerate/"] button');
            regenerateButton.disabled = false;
            regenerateButton.classList.remove('opacity-50', 'cursor-not-allowed');

            saveButton.disabled = false;
            saveButton.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function buildPaddedContent(html) {
            return '<html><head><style>'
                + 'html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}'
                + 'body{display:flex;flex-direction:column;align-items:center;}'
                + '.content-wrapper{padding:2rem;width:100%;max-width:1200px;box-sizing:border-box;min-height:100%;margin:0 auto;}'
                + 'img{max-width:100%;height:auto;display:block;margin:0 auto;}'
                + '*{box-sizing:border-box;word-wrap:break-word;}'
                + '</style></head><body><div class="content-wrapper">'
                + html
                + '</div></body></html>';
        }

        function hideLoadingState() {
            loadingContainer.style.display = 'none';
            contentFrame.srcdoc = buildPaddedContent(initialContent);
            enableButtons();
        }

        // Show initial content or loading state
        if (initialContent.includes("Generation in progress...")) {
            showLoadingState();
            contentFrame.srcdoc = '';
        } else {
            hideLoadingState();
        }

        // Update socket.on handler
        socket.on('generation_complete', function(data) {
            if (data.task_id === taskId) {
                if (data.status === 'error') {
                    hideLoadingState();
                    contentFrame.srcdoc = `
                        <html>
                        <head>
                            <style>
                                .error-message {
                                    color: red;
                                    padding: 2rem;
                                    text-align: center;
                                }
                            </style>
                        </head>
                        <body>
                            <div class="error-message">
                                Generation failed: ${data.message}
                            </div>
                        </body>
                        </html>
                    `;
                    enableButtons();
                    return;
                }

                // Ensure we have valid HTML content
                if (!data.html || data.html.trim().length < 10) {
                    hideLoadingState();
                    contentFrame.srcdoc = `
                        <html>
                        <body>
                            <div class="error-message">
                                Generation produced invalid content. Please try again.
                            </div>
                        </body>
                        </html>
                    `;
                    enableButtons();
                    return;
                }

                clearInterval(window._progressTimer);
                document.getElementById('gen-progress-bar').style.width = '100%';
                document.getElementById('gen-progress-pct').textContent = '100%';
                // Build content with data.html (not initialContent which is still the placeholder)
                const paddedContent = buildPaddedContent(data.html);
                setTimeout(() => {
                    loadingContainer.style.display = 'none';
                    contentFrame.srcdoc = paddedContent;
                    enableButtons();
                }, 300);
            }
        });
    </script>
        <script>
function updateCursor() {
    fetch('/check_cursor_effect')
        .then(response => response.json())
        .then(data => {
            if (data.has_dragon_cursor) {
                // Create and append style tag for cursor
                const styleTag = document.createElement('style');
                styleTag.textContent = "* { cursor: url('data:image/x-icon;base64,AAACAAEAICAQAAEAAQDoAgAAFgAAACgAAAAgAAAAQAAAAAEABAAAAAAAAAIAAAAAAAAAAAAAEAAAAAAAAAAAAAAADBl8AERFSgBeXmYACRd1AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAzAAAAAAAAAAAAAAAAAAACMAAAAAAAAAAAAAAAAAAAACAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAIwACMAAAAAAAAAAAAAAAAAAwAwAAAAAAAAAAAAAAAAAAMzMAAAAAAAAAAAAAAAAAAEIjAAAAAAAAAAAAAAAAAABEIgAAAAAAAAAAAAAAAAAEQQMwAAAAAAAAAAAAAAABFEAAMAAAAAAAAAAAAAAABBQAAjAAAAAAAAAAAAAAAERAAAAAAAAAAAAAAAAAAAREEAAAAAAAAAAAAAAAAABEQQAAAAAAAAAAAAAAAAARFBEAAAAAAAAAAAAAAAAEEREQAAAAAAAAAAAAAAAARBFBEAAAAAAAAAAAAAAAAUEUQQAAAAAAAAAAAAAEQRFBREAAAAAAAAAAAAAABERBREQAAAAAAAAAAAAAAARERERAAAAAAAAAAAAAAAABFBREAAAAAAAAAAAAAAAARBREQAAAAAAAAAAAAAAAARFEQAAAAAAAAAAAAAAAAAFEQAAAAAAAAAAAAAAAAAAUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///////////////////5////8P///+H////x///+cf///CH///4D////A////wP///8D///8Af//+BH///gh///wc///4H///4D///8A///+Af///AH//8AD//+AB///gA///4Af//+AP///AH///gD///4D///8D////n////w=='), pointer !important; }";
                document.head.appendChild(styleTag);
            } else {
                // Remove any existing cursor style tags
                const existingStyles = document.head.querySelectorAll('style');
                existingStyles.forEach(style => {
                    if (style.textContent.includes('cursor')) {
                        style.remove();
                    }
                });
            }
        })
        .catch(error => console.error('Error updating cursor:', error));
}

// Update cursor when page loads
document.addEventListener('DOMContentLoaded', updateCursor);

            </script>
</body>
</html>
